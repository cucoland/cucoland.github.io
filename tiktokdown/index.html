<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Descarga vídeos de TikTok</title>
<style>
:root{--bg:#0b0d14;--bg2:#131624;--line:#242a3d;--text:#eef0f7;--muted:#98a0b8;--cyan:#25f4ee;--pink:#fe2c55;--ok:#3ddc97;--err:#ff6b81;color-scheme:dark}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:3px solid var(--cyan);outline-offset:3px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;padding:18px 0}
.logo b{background:linear-gradient(90deg,var(--cyan),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero{padding:48px 0;text-align:center}
h1{font-size:clamp(2rem,5.5vw,3.2rem);line-height:1.1;letter-spacing:-.03em;margin-bottom:28px;text-shadow:-2px 0 rgba(37,244,238,.55),2px 0 rgba(254,44,85,.55)}
.box{display:flex;gap:10px;padding:8px;background:var(--bg2);border:1px solid var(--line);border-radius:18px}
.box:focus-within{border-color:var(--cyan)}
.box input{flex:1;min-width:0;background:none;border:0;color:var(--text);font:inherit;padding:12px 14px}
.box input:focus{outline:none}
.box input::placeholder{color:#656d86}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;border-radius:12px;padding:12px 22px;color:#06080f;background:linear-gradient(100deg,var(--cyan),#8af7f2 45%,#ff7d96)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.paste{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:0 12px;cursor:pointer;font:inherit;font-size:.9rem}
.msg{min-height:1.6em;margin-top:14px;font-size:.95rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--ok)}
#result{display:none;margin-top:28px;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:18px;gap:18px}
#result.show{display:grid;grid-template-columns:200px 1fr}
#cover{width:200px;aspect-ratio:9/14;object-fit:cover;border-radius:12px;background:#000}
#result h3{font-size:1.05rem;line-height:1.4;margin-bottom:6px;overflow-wrap:anywhere}
.meta{color:var(--muted);font-size:.9rem;margin-bottom:14px}
.actions{display:flex;flex-direction:column;gap:10px}
.grid-img{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px;margin-top:12px}
.grid-img a{display:block;border-radius:8px;overflow:hidden;aspect-ratio:3/4;background:#000}
.grid-img img{width:100%;height:100%;object-fit:cover}
@media(max-width:560px){
  .box{flex-wrap:wrap}.box input{flex-basis:100%}.btn{flex:1}.paste{padding:12px}
  #result.show{grid-template-columns:1fr}#cover{width:100%;max-height:340px;aspect-ratio:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">tik<b>4k</b></div>
  <main class="hero">
    <h1>Descargador de TikTok sin marca de agua</h1>
    <div class="box">
      <input id="url" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="Pega aquí el enlace del vídeo de TikTok" aria-label="URL de TikTok">
      <button class="paste" id="pasteBtn" type="button">Pegar</button>
      <button class="btn" id="goBtn" type="button">Descargar</button>
    </div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
    <div id="result">
      <img id="cover" alt="">
      <div>
        <h3 id="title"></h3>
        <div class="meta" id="meta"></div>
        <div class="actions" id="actions"></div>
        <div class="grid-img" id="images"></div>
      </div>
    </div>
  </main>
</div>

<script>
"use strict";
// Única dependencia externa: servicio que resuelve el enlace de TikTok en URLs directas.
const RESOLVER = "https://www.tikwm.com/api/";
const ORIGIN = "https://www.tikwm.com";
const $ = id => document.getElementById(id);

function setMsg(text, kind){ const m = $("msg"); m.textContent = text || ""; m.className = "msg" + (kind ? " " + kind : ""); }
function isTikTok(u){
  try{ const h = new URL(u).hostname.toLowerCase(); return h === "tiktok.com" || h.endsWith(".tiktok.com"); }
  catch{ return false; }
}
function absUrl(u){
  if(!u) return "";
  if(u.startsWith("//")) return "https:" + u;
  if(u.startsWith("/")) return ORIGIN + u;
  return u;
}
function safeUrl(u){ try{ const x = new URL(absUrl(u)); return /^https?:$/.test(x.protocol) ? x.href : ""; }catch{ return ""; } }
function fileName(base, ext){
  return (String(base||"tiktok").replace(/[\\/:*?"<>|\n\r]+/g," ").trim().slice(0,60) || "tiktok") + "." + ext;
}

async function saveFile(url, name){
  setMsg("Descargando archivo…");
  try{
    const r = await fetch(url, {referrerPolicy:"no-referrer"});
    if(!r.ok) throw new Error();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(await r.blob()); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    setMsg("Descarga iniciada.", "ok");
  }catch{
    window.open(url, "_blank", "noopener,noreferrer");
    setMsg("Se abrirá el archivo en una pestaña nueva: mantén pulsado o usa «Guardar como».");
  }
}

async function resolve(){
  const input = $("url").value.trim(), btn = $("goBtn");
  $("result").classList.remove("show");
  if(!input) return setMsg("Pega primero un enlace de TikTok.", "err");
  if(!isTikTok(input)) return setMsg("Ese enlace no parece ser de TikTok. Copia el enlace desde «Compartir» → «Copiar enlace».", "err");

  btn.disabled = true; setMsg("Procesando…");
  try{
    const r = await fetch(`${RESOLVER}?url=${encodeURIComponent(input)}&hd=1`, {referrerPolicy:"no-referrer"});
    const j = await r.json();
    if(!j || j.code !== 0 || !j.data) throw new Error("api");
    render(j.data);
    setMsg("Vídeo encontrado.", "ok");
  }catch(e){
    setMsg(e instanceof TypeError ? "Error de conexión con el servicio de descarga. Revisa tu red e inténtalo otra vez."
                                  : "No se pudo obtener el vídeo. Comprueba que sea público e inténtalo de nuevo.", "err");
  }finally{ btn.disabled = false; }
}

function render(d){
  const title = d.title || "TikTok";
  const user = d.author ? (d.author.unique_id || d.author.nickname || "") : "";
  const cover = safeUrl(d.cover || d.origin_cover);
  const img = $("cover");
  img.referrerPolicy = "no-referrer"; img.src = cover; img.alt = title; img.style.display = cover ? "" : "none";
  $("title").textContent = title;
  const n = v => new Intl.NumberFormat("es").format(+v || 0);
  $("meta").textContent = [user && "@" + user,
    d.play_count != null && `${n(d.play_count)} reproducciones`,
    d.digg_count != null && `${n(d.digg_count)} me gusta`].filter(Boolean).join("  ·  ");

  const box = $("actions"), grid = $("images");
  box.innerHTML = ""; grid.innerHTML = "";
  const add = (label, url, ext, primary) => {
    const href = safeUrl(url); if(!href) return;
    const b = document.createElement("button");
    b.type = "button"; b.className = "btn" + (primary ? "" : " ghost"); b.textContent = label;
    b.addEventListener("click", () => saveFile(href, fileName(title, ext)));
    box.appendChild(b);
  };
  const isSlide = Array.isArray(d.images) && d.images.length;
  if(!isSlide){
    if(d.hdplay) add("Descargar HD", d.hdplay, "mp4", true);
    if(d.play) add("Sin marca de agua", d.play, "mp4", !d.hdplay);
  }
  if(d.music) add("Audio MP3", d.music, "mp3", false);
  if(isSlide) d.images.forEach((u, i) => {
    const href = safeUrl(u); if(!href) return;
    const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.addEventListener("click", ev => { ev.preventDefault(); saveFile(href, fileName(title + " " + (i+1), "jpg")); });
    const im = document.createElement("img"); im.src = href; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer";
    a.appendChild(im); grid.appendChild(a);
  });
  $("result").classList.add("show");
}

$("goBtn").addEventListener("click", resolve);
$("url").addEventListener("keydown", e => { if(e.key === "Enter") resolve(); });
$("pasteBtn").addEventListener("click", async () => {
  try{
    const txt = (await navigator.clipboard.readText()).trim();
    $("url").value = txt; $("url").focus();
    if(isTikTok(txt)) resolve();
  }catch{ setMsg("No se pudo leer el portapapeles. Pega con Ctrl/Cmd+V.", "err"); }
});
</script>
</body>
</html>
