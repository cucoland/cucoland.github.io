<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Test: Aparato Respiratorio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg-card: #34495e;
            --ok: #27ae60;
            --ko: #e74c3c;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-left: max(.75rem, env(safe-area-inset-left));
            padding-right: max(.75rem, env(safe-area-inset-right));
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        /* Barra de tiempo / reinicio / progreso: siempre visible al hacer scroll */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 4px 12px;
            width: 100%;
            margin-bottom: 1rem;
            padding: 6px 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            font-size: clamp(.85rem, 3.6vw, 1.1rem);
        }

        .status-bar .group {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* Grid adaptable: cada elemento = carta + lista desplegable */
        #quiz-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
        }

        .quiz-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: box-shadow .3s, background-color .3s, border-color .3s;
        }

        .quiz-item.correct {
            background-color: #eafaf1;
            border-color: var(--ok);
            box-shadow: 0 0 0 3px rgba(39,174,96,.25), 0 6px 16px rgba(39,174,96,.45);
        }

        .quiz-item.wrong {
            background-color: #fdedec;
            border-color: var(--ko);
            box-shadow: 0 0 0 3px rgba(231,76,60,.25), 0 6px 16px rgba(231,76,60,.45);
        }

        /* Misma carta (cara con imagen) que en el juego de memoria */
        .quiz-card {
            /* Ancho fluido: se adapta al ancho de pantalla */
            flex: 0 0 clamp(84px, 26vw, 130px);
            width: clamp(84px, 26vw, 130px);
            aspect-ratio: 110 / 150;
            box-sizing: border-box;
            border: 3px solid #e67e22;
            background-color: #fffaf5;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 4px;
            position: relative;
        }

        .quiz-card svg {
            width: 100%;
            height: 100%;
        }

        .quiz-num {
            position: absolute;
            top: -9px;
            left: -9px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg-card);
            color: white;
            font-size: .75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.3);
        }

        .quiz-side {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quiz-select {
            width: 100%;
            padding: 8px 6px;
            /* 16px mínimo: evita el zoom automático en iOS; altura táctil cómoda */
            font-size: 1rem;
            min-height: 44px;
            font-weight: 600;
            color: var(--primary);
            background-color: #faf5ff;
            border: 2px solid #9b59b6;
            border-radius: 10px;
            cursor: pointer;
        }

        .quiz-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(155,89,182,.25);
        }

        .quiz-select:disabled {
            cursor: default;
            opacity: 1;
            color: var(--primary);
        }

        .quiz-item.correct .quiz-select { border-color: var(--ok); background-color: white; }
        .quiz-item.wrong .quiz-select { border-color: var(--ko); background-color: white; }

        .quiz-fix {
            font-size: .8rem;
            color: #922b21;
            font-weight: 600;
        }

        /* Botón Reiniciar (diseño original conservado) */
        #reset {
            background-color: #e8e8e8;
            padding: 4px 10px;
            min-height: 36px;
            font-size: inherit;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #cfcfcf;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 9px;
            cursor: pointer;
        }

        .quiz-fix:empty {
            display: none;
        }

        .quiz-fix {
            overflow-wrap: anywhere;
        }

        /* Pantallas muy estrechas: carta arriba, lista debajo */
        @media (max-width: 340px) {
            .quiz-item {
                flex-direction: column;
                align-items: stretch;
            }
            .quiz-card {
                align-self: center;
                flex-basis: auto;
            }
            .quiz-side {
                width: 100%;
            }
        }

        /* Pantallas grandes: más aire */
        @media (min-width: 1280px) {
            main { max-width: 72rem; }
        }
    </style>
</head>
<body class="pt-3 sm:pt-5 flex flex-col items-center">

    <header class="text-center mb-4 sm:mb-6 max-w-2xl w-full">
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-600 mb-2 break-words">Aparato Respiratorio</h1>
        <p class="text-gray-600 text-sm md:text-base">
            Elige en cada lista el nombre que corresponde a la imagen
        </p>
    </header>

    <main class="w-full max-w-5xl min-w-0 flex flex-col items-center">

        <div class="status-bar">
            <div class="group">
                <span class="font-bold text-slate-700">⏱️ Tiempo:</span>
                <span id="timer" class="font-mono font-bold text-emerald-600">00.00s</span>
            </div>
            <button id="reset" onclick="initGame()">
                Reiniciar
            </button>
            <div class="group">
                <span class="font-bold text-slate-700">📝 Nombradas:</span>
                <span id="progress" class="font-mono font-bold text-slate-600">0/0</span>
            </div>
        </div>

        <div id="result" class="hidden w-full mb-4 scroll-mt-16 bg-white rounded-2xl shadow-md border border-slate-200 p-4 text-center">
            <div id="result-score" class="text-lg sm:text-xl font-extrabold text-slate-700"></div>
            <div id="result-time" class="text-base font-semibold text-slate-500 mt-1"></div>
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-2 text-xs text-slate-500">
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-sm" style="background:#27ae60"></span> Correcta</span>
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-sm" style="background:#e74c3c"></span> Incorrecta</span>
            </div>
        </div>

        <div id="quiz-grid"></div>


    </main>

    <script>
        // ---------- Vista de pulmón: bronquios (contexto), bronquiolos y alvéolos ----------
        const LUNG_PATH = 'M60 12 C42 6 22 14 14 34 C6 58 6 90 12 108 C18 124 44 130 62 128 C82 126 96 118 98 100 C100 76 96 46 86 28 C80 18 70 13 60 12 Z';
        // [x1, y1, x2, y2, grosor]
        const LUNG_BRONCHI = [
            [66, 2, 66, 22, 6], [66, 22, 46, 42, 4.5], [66, 22, 78, 46, 4.5],
            [46, 42, 34, 62, 3.2], [46, 42, 54, 66, 3.2], [78, 46, 70, 68, 3.2], [78, 46, 83, 64, 3.2]
        ];
        // Extremos de los bronquios: [x, y, ángulo en grados]
        const LUNG_LEAVES = [[34, 62, 102], [54, 66, 92], [70, 68, 86], [83, 64, 94]];

        const LUNG_TREE = (function () {
            const rad = d => d * Math.PI / 180;
            const f = n => n.toFixed(1);
            const lines = [];
            const clusters = [];

            function branch(x, y, ang, len, depth) {
                [-1, 1].forEach(s => {
                    const a = ang + s * (depth === 0 ? 24 : 18);
                    const x2 = x + len * Math.cos(rad(a));
                    const y2 = y + len * Math.sin(rad(a));
                    lines.push(`<line x1="${f(x)}" y1="${f(y)}" x2="${f(x2)}" y2="${f(y2)}" stroke="#1f9bd1" stroke-width="${depth === 0 ? 1.9 : 1.3}" stroke-linecap="round"/>`);
                    if (depth < 1) {
                        branch(x2, y2, a, len * 0.8, depth + 1);
                    } else {
                        clusters.push({ x: x2 + 3 * Math.cos(rad(a)), y: y2 + 3 * Math.sin(rad(a)), rot: a });
                    }
                });
            }
            LUNG_LEAVES.forEach(([x, y, a]) => branch(x, y, a, 23, 0));

            const alveoli = clusters.map(c => {
                let s = '';
                for (let i = 0; i < 5; i++) {
                    const t = rad(c.rot + i * 72);
                    s += `<circle cx="${f(c.x + 3 * Math.cos(t))}" cy="${f(c.y + 3 * Math.sin(t))}" r="2.3" fill="#f08aa0" stroke="#c2185b" stroke-width=".7"/>`;
                }
                return s + `<circle cx="${f(c.x)}" cy="${f(c.y)}" r="2.2" fill="#f5b5c3" stroke="#c2185b" stroke-width=".7"/>`;
            }).join('');

            return { bronchioles: lines.join(''), alveoli };
        })();

        const LUNG_BRONCHI_SVG = LUNG_BRONCHI
            .map(([x1, y1, x2, y2, w]) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#2e86c1" stroke-width="${w}" stroke-linecap="round"/>`)
            .join('');

        const organsData = [
            {
                id: 'nariz',
                name: 'Fosas nasales',
                draw: `<path d="M60 9 C57 14 54 20 51.5 25 C54 28.5 57 28 60 27 C63 28 66 28.5 68.5 25 C66 20 63 14 60 9 Z" fill="#e8a87c" stroke="#b9703f" stroke-width="1.2" stroke-linejoin="round"/><path d="M60 15 V25" stroke="#b9703f" stroke-width="1" opacity=".7"/><ellipse cx="56" cy="25.3" rx="2.4" ry="1.5" fill="#6b3a1e"/><ellipse cx="64" cy="25.3" rx="2.4" ry="1.5" fill="#6b3a1e"/>`
            },
            {
                id: 'faringe',
                name: 'Faringe',
                draw: `<path d="M52 31 H68 C68 37 65.5 40 64.5 43 V46 H55.5 V43 C54.5 40 52 37 52 31 Z" fill="#d6608a" stroke="#9c3560" stroke-width="1.2" stroke-linejoin="round"/><path d="M56 36 V45 M64 36 V45" stroke="#f5b7cd" stroke-width="1" opacity=".8"/>`
            },
            {
                id: 'laringe',
                name: 'Laringe',
                draw: `<path d="M54 46 H66 L65.5 57 C62.5 59.5 57.5 59.5 54.5 57 Z" fill="#8e6bbf" stroke="#5b3f8c" stroke-width="1.2" stroke-linejoin="round"/><path d="M60 47 V58 M56.5 52 H63.5" stroke="#d2c3ea" stroke-width="1" opacity=".9"/>`
            },
            {
                id: 'traquea',
                name: 'Tráquea',
                draw: `<path d="M60 58 V81" fill="none" stroke="#2874a6" stroke-width="7" stroke-linecap="round"/><path d="M60 58 V81" fill="none" stroke="#5dade2" stroke-width="5" stroke-linecap="round"/><path d="M60 58 V81" fill="none" stroke="#2874a6" stroke-width="5" stroke-dasharray=".9 2.3" opacity=".7"/>`
            },
            {
                id: 'bronquios',
                name: 'Bronquios',
                draw: `<path d="M60 80 L49 91 M60 80 L71 91" fill="none" stroke="#1b4f72" stroke-width="6.5" stroke-linecap="round"/><path d="M60 80 L49 91 M60 80 L71 91" fill="none" stroke="#2e86c1" stroke-width="4.5" stroke-linecap="round"/><path d="M49 91 L40 99 M49 91 L50 103 M49 91 L41 86 M71 91 L80 99 M71 91 L70 103 M71 91 L79 86" fill="none" stroke="#2e86c1" stroke-width="3" stroke-linecap="round"/><path d="M40 99 L34 104 M40 99 L38 105 M50 103 L47 107 M50 103 L53 107 M41 86 L35 84 M41 86 L36 90 M80 99 L86 104 M80 99 L82 105 M70 103 L73 107 M70 103 L67 106 M79 86 L85 84 M79 86 L84 90" fill="none" stroke="#2e86c1" stroke-width="1.8" stroke-linecap="round"/>`
            },
                        {
                id: 'pulmones',
                name: 'Pulmones',
                draw: `<path d="M57 66 C55 62 48 60 42 63 C34 67 30 78 29 90 C28 100 31 106 38 108 C46 110 54 108 57 104 C58 94 58 78 57 66 Z" fill="#f1948a" stroke="#c0392b" stroke-width="1.4" stroke-linejoin="round"/><path d="M29 82 C38 86 48 84 57 77 M31 98 C42 96 50 98 57 94" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" opacity=".7"/><path d="M36 70 C33 76 32 84 32 90" fill="none" stroke="#fadbd8" stroke-width="2" stroke-linecap="round" opacity=".8"/><path d="M63 66 C65 62 72 60 78 63 C86 67 90 78 91 90 C92 100 89 106 82 108 C74 110 67 108 63 104 C66 100 69 96 67 90 C65 84 63 76 63 66 Z" fill="#f1948a" stroke="#c0392b" stroke-width="1.4" stroke-linejoin="round"/><path d="M91 86 C82 88 73 86 66 80" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-linecap="round" opacity=".7"/><path d="M84 70 C87 76 88 84 88 90" fill="none" stroke="#fadbd8" stroke-width="2" stroke-linecap="round" opacity=".8"/>`
            },
            {
                id: 'bronquiolos',
                name: 'Bronquiolos',
                view: 'lung',
                draw: LUNG_TREE.bronchioles
            },
            {
                id: 'alveolos',
                name: 'Alvéolos',
                view: 'lung',
                draw: LUNG_TREE.alveoli
            },
            {
                id: 'diafragma',
                name: 'Diafragma',
                draw: `<path d="M31 117 C33 106 46 102 58 108 C60 109 60 109 62 108 C74 102 87 106 89 117 C82 122 72 123 60 123 C48 123 38 122 31 117 Z" fill="#b5483a" stroke="#7b241c" stroke-width="1.4" stroke-linejoin="round"/><path d="M60 109 V122 M48 107 L45 121 M72 107 L75 121 M38 111 L38 120 M82 111 L82 120" stroke="#e6a79d" stroke-width="1" opacity=".7"/>`
            }
        ];

        // Silueta de torso con TODOS los órganos al 20 % y el órgano indicado en color pleno
        const TORSO_PATH = 'M60 2 C48 2 44 12 44 20 C44 28 48 34 53 37 L53 44 C40 46 26 48 21 56 C18 66 23 80 27 96 C29 106 28 118 29 130 L29 136 H91 L91 130 C92 118 91 106 93 96 C97 80 102 66 99 56 C94 48 80 46 67 44 L67 37 C72 34 76 28 76 20 C76 12 72 2 60 2 Z';

        function buildTorso(highlightId) {
            const target = organsData.find(o => o.id === highlightId);
            const torsoOrgans = organsData.filter(o => o.view !== 'lung');
            // El órgano destacado se dibuja el último para que quede por encima
            const ordered = [
                ...torsoOrgans.filter(o => o.id !== highlightId),
                target
            ];
            const organs = ordered
                .map(o => `<g opacity="${o.id === highlightId ? 1 : 0.2}">${o.draw}</g>`)
                .join('');
            return `<svg viewBox="0 0 120 138" role="img" aria-label="Torso humano con ${target.name} destacado"><path d="${TORSO_PATH}" fill="#e9eef2" stroke="#9aa7b0" stroke-width="1.5" stroke-linejoin="round"/>${organs}</svg>`;
        }

        // Pulmón con el árbol bronquial: solo la estructura indicada va en color pleno
        function buildLung(highlightId) {
            const target = organsData.find(o => o.id === highlightId);
            const lungOrgans = organsData.filter(o => o.view === 'lung');
            const ordered = [
                ...lungOrgans.filter(o => o.id !== highlightId),
                target
            ];
            const structures = ordered
                .map(o => `<g opacity="${o.id === highlightId ? 1 : 0.2}">${o.draw}</g>`)
                .join('');
            return `<svg viewBox="0 0 120 138" role="img" aria-label="Pulmón con ${target.name} destacado"><path d="${LUNG_PATH}" fill="#fdecea" stroke="#c0392b" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 76 C40 86 72 82 98 60" fill="none" stroke="#c0392b" stroke-width="1.2" opacity=".35" stroke-linecap="round"/><g opacity=".2">${LUNG_BRONCHI_SVG}</g>${structures}</svg>`;
        }

        function buildImage(id) {
            const organ = organsData.find(o => o.id === id);
            return organ.view === 'lung' ? buildLung(id) : buildTorso(id);
        }

        let timerInterval = null;
        let startTime = null;
        let finished = false;
        let quizItems = [];

        const grid = document.getElementById('quiz-grid');
        const timerElement = document.getElementById('timer');
        const progressElement = document.getElementById('progress');
        const resultBox = document.getElementById('result');
        const resultScore = document.getElementById('result-score');
        const resultTime = document.getElementById('result-time');

        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function imageFor(id) {
            return typeof buildImage === 'function' ? buildImage(id) : buildTorso(id);
        }

        function initGame() {
            if (timerInterval) clearInterval(timerInterval);
            finished = false;
            grid.innerHTML = '';
            resultBox.classList.add('hidden');
            timerElement.textContent = '00.00s';

            // Nombres disponibles (orden alfabético para no revelar la solución)
            const names = organsData.map(o => o.name).sort((a, b) => a.localeCompare(b, 'es'));
            const optionsHtml = `<option value="">Elige un nombre…</option>` +
                names.map(n => `<option value="${n}">${n}</option>`).join('');

            quizItems = shuffle(organsData).map((organ, i) => {
                const item = document.createElement('div');
                item.className = 'quiz-item';
                item.innerHTML = `
                    <div class="quiz-card">
                        <span class="quiz-num">${i + 1}</span>
                        ${imageFor(organ.id)}
                    </div>
                    <div class="quiz-side">
                        <select class="quiz-select" aria-label="Nombre de la carta ${i + 1}">${optionsHtml}</select>
                        <div class="quiz-fix"></div>
                    </div>
                `;
                const select = item.querySelector('select');
                select.addEventListener('change', onAnswer);
                grid.appendChild(item);
                return { organ, item, select, fix: item.querySelector('.quiz-fix') };
            });

            updateProgress();
            startTimer();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                timerElement.textContent = ((Date.now() - startTime) / 1000).toFixed(2) + 's';
            }, 50);
        }

        function updateProgress() {
            const done = quizItems.filter(q => q.select.value !== '').length;
            progressElement.textContent = `${done}/${quizItems.length}`;
            return done;
        }

        function onAnswer() {
            if (finished) return;
            const done = updateProgress();
            if (done === quizItems.length) finishTest();
        }

        function finishTest() {
            finished = true;
            clearInterval(timerInterval);
            const elapsed = (Date.now() - startTime) / 1000;
            timerElement.textContent = elapsed.toFixed(2) + 's';

            let hits = 0;
            quizItems.forEach(q => {
                q.select.disabled = true;
                const ok = q.select.value === q.organ.name;
                if (ok) hits++;
                q.item.classList.add(ok ? 'correct' : 'wrong');
                if (!ok) q.fix.textContent = `Correcta: ${q.organ.name}`;
            });

            resultScore.textContent = `🎯 ${hits} de ${quizItems.length} cartas acertadas`;
            resultTime.textContent = `⏱️ Tiempo empleado: ${elapsed.toFixed(2)}s`;
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        initGame();
    </script>
</body>
</html>
