<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Test: Aparato Digestivo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg-card: #34495e;
            --ok: #27ae60;
            --ko: #e74c3c;
        }

        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--primary);
            min-height: 100vh;
            min-height: 100dvh;
            overflow-x: hidden;
            padding-left: max(.75rem, env(safe-area-inset-left));
            padding-right: max(.75rem, env(safe-area-inset-right));
            padding-bottom: max(1.25rem, env(safe-area-inset-bottom));
        }

        /* Barra de tiempo / reinicio / progreso: siempre visible al hacer scroll */
        .status-bar {
            position: sticky;
            top: 0;
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 4px 12px;
            width: 100%;
            margin-bottom: 1rem;
            padding: 6px 12px;
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,.08);
            font-size: clamp(.85rem, 3.6vw, 1.1rem);
        }

        .status-bar .group {
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        /* Grid adaptable: cada elemento = carta + lista desplegable */
        #quiz-grid {
            display: grid;
            gap: 8px;
            width: 100%;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr));
        }

        .quiz-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px;
            background: white;
            border: 2px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            transition: box-shadow .3s, background-color .3s, border-color .3s;
        }

        .quiz-item.correct {
            background-color: #eafaf1;
            border-color: var(--ok);
            box-shadow: 0 0 0 3px rgba(39,174,96,.25), 0 6px 16px rgba(39,174,96,.45);
        }

        .quiz-item.wrong {
            background-color: #fdedec;
            border-color: var(--ko);
            box-shadow: 0 0 0 3px rgba(231,76,60,.25), 0 6px 16px rgba(231,76,60,.45);
        }

        /* Misma carta (cara con imagen) que en el juego de memoria */
        .quiz-card {
            /* Ancho fluido: se adapta al ancho de pantalla */
            flex: 0 0 clamp(84px, 26vw, 130px);
            width: clamp(84px, 26vw, 130px);
            aspect-ratio: 110 / 150;
            box-sizing: border-box;
            border: 3px solid #e67e22;
            background-color: #fffaf5;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 4px;
            position: relative;
        }

        .quiz-card svg {
            width: 100%;
            height: 100%;
        }

        .quiz-num {
            position: absolute;
            top: -9px;
            left: -9px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--bg-card);
            color: white;
            font-size: .75rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 1px 3px rgba(0,0,0,.3);
        }

        .quiz-side {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quiz-select {
            width: 100%;
            padding: 8px 6px;
            /* 16px mínimo: evita el zoom automático en iOS; altura táctil cómoda */
            font-size: 1rem;
            min-height: 44px;
            font-weight: 600;
            color: var(--primary);
            background-color: #faf5ff;
            border: 2px solid #9b59b6;
            border-radius: 10px;
            cursor: pointer;
        }

        .quiz-select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(155,89,182,.25);
        }

        .quiz-select:disabled {
            cursor: default;
            opacity: 1;
            color: var(--primary);
        }

        .quiz-item.correct .quiz-select { border-color: var(--ok); background-color: white; }
        .quiz-item.wrong .quiz-select { border-color: var(--ko); background-color: white; }

        .quiz-fix {
            font-size: .8rem;
            color: #922b21;
            font-weight: 600;
        }

        /* Botón Reiniciar (diseño original conservado) */
        #reset {
            background-color: #e8e8e8;
            padding: 4px 10px;
            min-height: 36px;
            font-size: inherit;
            font-weight: 600;
            white-space: nowrap;
            border: 1px solid #cfcfcf;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 9px;
            cursor: pointer;
        }

        .quiz-fix:empty {
            display: none;
        }

        .quiz-fix {
            overflow-wrap: anywhere;
        }

        /* Pantallas muy estrechas: carta arriba, lista debajo */
        @media (max-width: 340px) {
            .quiz-item {
                flex-direction: column;
                align-items: stretch;
            }
            .quiz-card {
                align-self: center;
                flex-basis: auto;
            }
            .quiz-side {
                width: 100%;
            }
        }

        /* Pantallas grandes: más aire */
        @media (min-width: 1280px) {
            main { max-width: 72rem; }
        }
    </style>
</head>
<body class="pt-3 sm:pt-5 flex flex-col items-center">

    <header class="text-center mb-4 sm:mb-6 max-w-2xl w-full">
        <h1 class="text-xl sm:text-2xl font-extrabold text-slate-600 mb-2 break-words">Aparato Digestivo</h1>
        <p class="text-gray-600 text-sm md:text-base">
            Elige en cada lista el nombre que corresponde a la imagen
        </p>
    </header>

    <main class="w-full max-w-5xl min-w-0 flex flex-col items-center">

        <div class="status-bar">
            <div class="group">
                <span class="font-bold text-slate-700">⏱️ Tiempo:</span>
                <span id="timer" class="font-mono font-bold text-emerald-600">00.00s</span>
            </div>
            <button id="reset" onclick="initGame()">
                Reiniciar
            </button>
            <div class="group">
                <span class="font-bold text-slate-700">📝 Nombradas:</span>
                <span id="progress" class="font-mono font-bold text-slate-600">0/0</span>
            </div>
        </div>

        <div id="result" class="hidden w-full mb-4 scroll-mt-16 bg-white rounded-2xl shadow-md border border-slate-200 p-4 text-center">
            <div id="result-score" class="text-lg sm:text-xl font-extrabold text-slate-700"></div>
            <div id="result-time" class="text-base font-semibold text-slate-500 mt-1"></div>
            <div class="flex flex-wrap justify-center gap-x-4 gap-y-1 mt-2 text-xs text-slate-500">
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-sm" style="background:#27ae60"></span> Correcta</span>
                <span class="flex items-center gap-1"><span class="inline-block w-3 h-3 rounded-sm" style="background:#e74c3c"></span> Incorrecta</span>
            </div>
        </div>

        <div id="quiz-grid"></div>


    </main>

    <script>
        const organsData = [
            {
                id: 'boca',
                name: 'Boca',
                draw: `<path d="M50 27 C54 22 58 24 60 25.5 C62 24 66 22 70 27 C66 33 62 34 60 34 C58 34 54 33 50 27 Z" fill="#e74c3c" stroke="#a93226" stroke-width="1" stroke-linejoin="round"/><path d="M52 28 C57 26 63 26 68 28 C64 31 56 31 52 28 Z" fill="#6e1f17"/><path d="M54 27.4 C58 26.4 62 26.4 66 27.4 L65.5 29 C62 28 58 28 54.5 29 Z" fill="#fff"/>`
            },
            {
                id: 'faringe',
                name: 'Faringe',
                draw: `<path d="M51 32 H69 C69 39 65.5 42 64.5 46 V51 H55.5 V46 C54.5 42 51 39 51 32 Z" fill="#d6608a" stroke="#9c3560" stroke-width="1.2" stroke-linejoin="round"/><path d="M56 38 V48 M64 38 V48" stroke="#f5b7cd" stroke-width="1" opacity=".8"/>`
            },
            {
                id: 'esofago',
                name: 'Esófago',
                draw: `<path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#b9573a" stroke-width="6.5" stroke-linecap="round"/><path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#e8845f" stroke-width="4.5" stroke-linecap="round"/><path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#b9573a" stroke-width="4.5" stroke-dasharray=".7 3" opacity=".6"/>`
            },
            {
                id: 'estomago',
                name: 'Estómago',
                draw: `<g transform="translate(57 72) scale(.58)"><path d="M22 4 H30 V14 C30 17 33 18 37 19 C51 21 58 31 54 43 C50 54 38 58 28 54 C19 50 15 41 17 31 C18 25 22 23 22 17 Z" fill="#f1948a" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><path d="M30 28 C38 28 46 33 46 42" stroke="#c0392b" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/><path d="M26 36 C30 44 38 48 44 48" stroke="#c0392b" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/></g>`
            },
            {
                id: 'higado',
                name: 'Hígado',
                draw: `<path d="M29 84 C29 77 41 73 53 75 C63 77 68 81 68 87 C66 93 59 95 53 99 C43 103 33 99 30 93 C28 90 29 86 29 84 Z" fill="#a0462d" stroke="#6e2c1b" stroke-width="1.4" stroke-linejoin="round"/><path d="M54 76 C52 84 54 92 58 97" stroke="#6e2c1b" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M34 82 C38 79 43 78 47 78" stroke="#d98a6c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>`
            },
            {
                id: 'vesicula',
                name: 'Vesícula biliar',
                draw: `<path d="M46 97 C41 101 42 112 49 112 C55 112 54 103 52 98 Z" fill="#58b368" stroke="#2e7d3f" stroke-width="1.4" stroke-linejoin="round"/><path d="M46 104 C46 107 47 109 49 109" stroke="#a9e0b4" stroke-width="1.2" fill="none" stroke-linecap="round"/>`
            },
            {
                id: 'pancreas',
                name: 'Páncreas',
                draw: `<path d="M46 114 C52 108 64 109 72 111 C80 111 85 107 90 109 C93 112 90 117 84 117 C75 117 69 115 61 115 C55 115 51 117 46 114 Z" fill="#f5cd79" stroke="#c9922c" stroke-width="1.4" stroke-linejoin="round"/><path d="M50 113 C60 111 72 113 86 112" stroke="#c9922c" stroke-width="1" fill="none"/><circle cx="58" cy="112.5" r=".9" fill="#e0a73b"/><circle cx="68" cy="113" r=".9" fill="#e0a73b"/><circle cx="78" cy="113" r=".9" fill="#e0a73b"/>`
            },
            {
                id: 'delgado',
                name: 'Intestino Delgado',
                draw: `<path d="M48 127 H72 C76 127 76 133 72 133 H48 C44 133 44 139 48 139 H70" fill="none" stroke="#c9674c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 127 H72 C76 127 76 133 72 133 H48 C44 133 44 139 48 139 H70" fill="none" stroke="#f5b7a3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`
            },
            {
                id: 'grueso',
                name: 'Intestino Grueso',
                draw: `<path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#8a5a24" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#c8924f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#8a5a24" stroke-width="5.5" stroke-dasharray=".8 3.6" stroke-linejoin="round"/>`
            },
            {
                id: 'ano',
                name: 'Ano',
                draw: `<circle cx="60" cy="158" r="6.5" fill="#c0392b" stroke="#7b241c" stroke-width="1.2"/><circle cx="60" cy="158" r="2.4" fill="#4a1410"/><path d="M60 151.5 V155.5 M60 160.5 V164.5 M53.5 158 H57.5 M62.5 158 H66.5" stroke="#f1948a" stroke-width="1" stroke-linecap="round"/>`
            }
        ];

        // Silueta de torso con TODOS los órganos al 20 % y el órgano indicado en color pleno
        const TORSO_PATH = 'M60 2 C48 2 44 12 44 20 C44 28 48 34 53 37 L53 44 C40 46 26 48 21 56 C18 66 23 80 27 96 C29 106 28 118 29 130 C30 142 34 154 44 161 C50 165 55 165 60 165 C65 165 70 165 76 161 C86 154 90 142 91 130 C92 118 91 106 93 96 C97 80 102 66 99 56 C94 48 80 46 67 44 L67 37 C72 34 76 28 76 20 C76 12 72 2 60 2 Z';

        function buildTorso(highlightId) {
            const target = organsData.find(o => o.id === highlightId);
            // El órgano destacado se dibuja el último para que quede por encima
            const ordered = [
                ...organsData.filter(o => o.id !== highlightId),
                target
            ];
            const organs = ordered
                .map(o => `<g opacity="${o.id === highlightId ? 1 : 0.2}">${o.draw}</g>`)
                .join('');
            return `<svg viewBox="0 0 120 170" role="img" aria-label="Torso humano con ${target.name} destacado"><path d="${TORSO_PATH}" fill="#e9eef2" stroke="#9aa7b0" stroke-width="1.5" stroke-linejoin="round"/>${organs}</svg>`;
        }

        let timerInterval = null;
        let startTime = null;
        let finished = false;
        let quizItems = [];

        const grid = document.getElementById('quiz-grid');
        const timerElement = document.getElementById('timer');
        const progressElement = document.getElementById('progress');
        const resultBox = document.getElementById('result');
        const resultScore = document.getElementById('result-score');
        const resultTime = document.getElementById('result-time');

        function shuffle(array) {
            const a = [...array];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function imageFor(id) {
            return typeof buildImage === 'function' ? buildImage(id) : buildTorso(id);
        }

        function initGame() {
            if (timerInterval) clearInterval(timerInterval);
            finished = false;
            grid.innerHTML = '';
            resultBox.classList.add('hidden');
            timerElement.textContent = '00.00s';

            // Nombres disponibles (orden alfabético para no revelar la solución)
            const names = organsData.map(o => o.name).sort((a, b) => a.localeCompare(b, 'es'));
            const optionsHtml = `<option value="">Elige un nombre…</option>` +
                names.map(n => `<option value="${n}">${n}</option>`).join('');

            quizItems = shuffle(organsData).map((organ, i) => {
                const item = document.createElement('div');
                item.className = 'quiz-item';
                item.innerHTML = `
                    <div class="quiz-card">
                        <span class="quiz-num">${i + 1}</span>
                        ${imageFor(organ.id)}
                    </div>
                    <div class="quiz-side">
                        <select class="quiz-select" aria-label="Nombre de la carta ${i + 1}">${optionsHtml}</select>
                        <div class="quiz-fix"></div>
                    </div>
                `;
                const select = item.querySelector('select');
                select.addEventListener('change', onAnswer);
                grid.appendChild(item);
                return { organ, item, select, fix: item.querySelector('.quiz-fix') };
            });

            updateProgress();
            startTimer();
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                timerElement.textContent = ((Date.now() - startTime) / 1000).toFixed(2) + 's';
            }, 50);
        }

        function updateProgress() {
            const done = quizItems.filter(q => q.select.value !== '').length;
            progressElement.textContent = `${done}/${quizItems.length}`;
            return done;
        }

        function onAnswer() {
            if (finished) return;
            const done = updateProgress();
            if (done === quizItems.length) finishTest();
        }

        function finishTest() {
            finished = true;
            clearInterval(timerInterval);
            const elapsed = (Date.now() - startTime) / 1000;
            timerElement.textContent = elapsed.toFixed(2) + 's';

            let hits = 0;
            quizItems.forEach(q => {
                q.select.disabled = true;
                const ok = q.select.value === q.organ.name;
                if (ok) hits++;
                q.item.classList.add(ok ? 'correct' : 'wrong');
                if (!ok) q.fix.textContent = `Correcta: ${q.organ.name}`;
            });

            resultScore.textContent = `🎯 ${hits} de ${quizItems.length} cartas acertadas`;
            resultTime.textContent = `⏱️ Tiempo empleado: ${elapsed.toFixed(2)}s`;
            resultBox.classList.remove('hidden');
            resultBox.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        initGame();
    </script>
</body>
</html>
