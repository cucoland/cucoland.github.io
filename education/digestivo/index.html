<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juego de Memoria: Aparato Digestivo (Individual)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #27ae60;
            --bg-card: #34495e;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: var(--primary);
        }

        /* Grid adaptable: mínimo 3 y máximo 6 cartas por fila, separación de 5px */
        #game-grid {
            --gap: 5px;
            display: grid;
            gap: var(--gap);
            width: 100%;
            /* Ancho mínimo de carta:
               - nunca menor que 1/6 del ancho (máx. 6 por fila) ni que 100px,
               - nunca mayor que 1/3 del ancho (mín. 3 por fila). */
            --card-min: min(
                max(100px, calc((100% - 5 * var(--gap)) / 6)),
                calc((100% - 2 * var(--gap) - 1px) / 3)
            );
            grid-template-columns: repeat(auto-fill, minmax(var(--card-min), 1fr));
        }

        .card {
            width: 100%;
            aspect-ratio: 110 / 150;
            perspective: 1000px;
            cursor: pointer;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
            box-sizing: border-box;
        }

        .card-front {
            background-color: var(--bg-card);
            color: white;
            font-size: 2.2rem;
            font-weight: bold;
            border: 2px solid #2c3e50;
        }

        .card-back {
            background-color: white;
            transform: rotateY(180deg);
            border: 3px solid #bdc3c7;
        }

        .card-back.type-image {
            border-color: #e67e22;
            background-color: #fffaf5;
            padding: 4px;
        }

        .card-back.type-text {
            border-color: #9b59b6;
            background-color: #faf5ff;
        }

        .card-back svg {
            width: 100%;
            height: 100%;
        }

        .card-back span {
            font-size: 1rem;
            font-weight: bold;
            text-align: center;
            color: #2c3e50;
        }
    </style>
</head>
<body class="min-h-screen py-5 px-3 flex flex-col items-center">

    <header class="text-center mb-6 max-w-2xl">
        <h1 class="text-2xl font-extrabold text-slate-600 mb-2">Juego de Memoria: Aparato Digestivo</h1>
        <p class="text-gray-600 text-sm md:text-base">
             Empareja la imagen del órgano con su nombre lo más rápido posible. ¡Tiempo!
        </p>
    </header>

    <main class="w-full max-w-5xl flex flex-col lg:flex-row gap-8 items-center lg:items-start justify-center">
        
        <!-- Game Section -->
        <div class="flex flex-col items-center flex-1">
            <div class="flex items-center justify-between w-full mb-4 bg-white px-3 py-1 rounded-xl shadow-sm border border-slate-200">
                <span class="text-l font-bold text-slate-700">⏱️ Tiempo:</span>
                <span id="timer" class="text-l font-mono font-bold text-emerald-600">00.00s</span>
            </div>

            <div class="winner-msg text-center font-bold text-lg text-emerald-600 min-h-[30px] mb-3" id="winner-text"></div>

            <div id="game-grid"></div>

            <button id="btn-reset" onclick="initGame()" class="mt-6 px-6 py-3 text-white bg-slate-800 font-bold rounded-full shadow-md hover:bg-slate-700 transition cursor-pointer">
                Reiniciar Partida
            </button>
        </div>

        <!-- High Scores Panel -->
        <aside class="w-full lg:w-80 bg-white rounded-2xl shadow-md border border-slate-200 p-6 flex flex-col">
            <h2 class="text-xl font-bold text-slate-800 mb-4 flex items-center gap-2">
                🏆 Top 10 Mejores Tiempos
            </h2>
            <div id="scores-container" class="flex-1 overflow-y-auto max-h-[350px]">
                <p class="text-gray-400 text-sm italic text-center py-4">No hay registros todavía.</p>
            </div>
            <button onclick="clearScores()" class="mt-4 text-xs text-red-500 hover:underline text-center cursor-pointer">
                Borrar récords
            </button>
        </aside>
    </main>

    <script>
        const organsData = [
            {
                id: 'boca',
                name: 'Boca',
                draw: `<path d="M50 27 C54 22 58 24 60 25.5 C62 24 66 22 70 27 C66 33 62 34 60 34 C58 34 54 33 50 27 Z" fill="#e74c3c" stroke="#a93226" stroke-width="1" stroke-linejoin="round"/><path d="M52 28 C57 26 63 26 68 28 C64 31 56 31 52 28 Z" fill="#6e1f17"/><path d="M54 27.4 C58 26.4 62 26.4 66 27.4 L65.5 29 C62 28 58 28 54.5 29 Z" fill="#fff"/>`
            },
            {
                id: 'faringe',
                name: 'Faringe',
                draw: `<path d="M51 32 H69 C69 39 65.5 42 64.5 46 V51 H55.5 V46 C54.5 42 51 39 51 32 Z" fill="#d6608a" stroke="#9c3560" stroke-width="1.2" stroke-linejoin="round"/><path d="M56 38 V48 M64 38 V48" stroke="#f5b7cd" stroke-width="1" opacity=".8"/>`
            },
            {
                id: 'esofago',
                name: 'Esófago',
                draw: `<path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#b9573a" stroke-width="6.5" stroke-linecap="round"/><path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#e8845f" stroke-width="4.5" stroke-linecap="round"/><path d="M60 50 V66 C60 72 71 70 71.5 77" fill="none" stroke="#b9573a" stroke-width="4.5" stroke-dasharray=".7 3" opacity=".6"/>`
            },
            {
                id: 'estomago',
                name: 'Estómago',
                draw: `<g transform="translate(57 72) scale(.58)"><path d="M22 4 H30 V14 C30 17 33 18 37 19 C51 21 58 31 54 43 C50 54 38 58 28 54 C19 50 15 41 17 31 C18 25 22 23 22 17 Z" fill="#f1948a" stroke="#c0392b" stroke-width="3" stroke-linejoin="round"/><path d="M30 28 C38 28 46 33 46 42" stroke="#c0392b" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/><path d="M26 36 C30 44 38 48 44 48" stroke="#c0392b" stroke-width="2.4" fill="none" opacity=".6" stroke-linecap="round"/></g>`
            },
            {
                id: 'higado',
                name: 'Hígado',
                draw: `<path d="M29 84 C29 77 41 73 53 75 C63 77 68 81 68 87 C66 93 59 95 53 99 C43 103 33 99 30 93 C28 90 29 86 29 84 Z" fill="#a0462d" stroke="#6e2c1b" stroke-width="1.4" stroke-linejoin="round"/><path d="M54 76 C52 84 54 92 58 97" stroke="#6e2c1b" stroke-width="1.4" fill="none" stroke-linecap="round"/><path d="M34 82 C38 79 43 78 47 78" stroke="#d98a6c" stroke-width="2" fill="none" stroke-linecap="round" opacity=".8"/>`
            },
            {
                id: 'vesicula',
                name: 'Vesícula biliar',
                draw: `<path d="M46 97 C41 101 42 112 49 112 C55 112 54 103 52 98 Z" fill="#58b368" stroke="#2e7d3f" stroke-width="1.4" stroke-linejoin="round"/><path d="M46 104 C46 107 47 109 49 109" stroke="#a9e0b4" stroke-width="1.2" fill="none" stroke-linecap="round"/>`
            },
            {
                id: 'pancreas',
                name: 'Páncreas',
                draw: `<path d="M46 114 C52 108 64 109 72 111 C80 111 85 107 90 109 C93 112 90 117 84 117 C75 117 69 115 61 115 C55 115 51 117 46 114 Z" fill="#f5cd79" stroke="#c9922c" stroke-width="1.4" stroke-linejoin="round"/><path d="M50 113 C60 111 72 113 86 112" stroke="#c9922c" stroke-width="1" fill="none"/><circle cx="58" cy="112.5" r=".9" fill="#e0a73b"/><circle cx="68" cy="113" r=".9" fill="#e0a73b"/><circle cx="78" cy="113" r=".9" fill="#e0a73b"/>`
            },
            {
                id: 'delgado',
                name: 'Intestino Delgado',
                draw: `<path d="M48 127 H72 C76 127 76 133 72 133 H48 C44 133 44 139 48 139 H70" fill="none" stroke="#c9674c" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M48 127 H72 C76 127 76 133 72 133 H48 C44 133 44 139 48 139 H70" fill="none" stroke="#f5b7a3" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`
            },
            {
                id: 'grueso',
                name: 'Intestino Grueso',
                draw: `<path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#8a5a24" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#c8924f" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M38 142 V124 Q38 121 41 121 H79 Q82 121 82 124 V138 C82 145 68 144 64 146 L60 148 V152" fill="none" stroke="#8a5a24" stroke-width="5.5" stroke-dasharray=".8 3.6" stroke-linejoin="round"/>`
            },
            {
                id: 'ano',
                name: 'Ano',
                draw: `<circle cx="60" cy="158" r="6.5" fill="#c0392b" stroke="#7b241c" stroke-width="1.2"/><circle cx="60" cy="158" r="2.4" fill="#4a1410"/><path d="M60 151.5 V155.5 M60 160.5 V164.5 M53.5 158 H57.5 M62.5 158 H66.5" stroke="#f1948a" stroke-width="1" stroke-linecap="round"/>`
            }
        ];

        // Silueta de torso con TODOS los órganos al 20 % y el órgano indicado en color pleno
        const TORSO_PATH = 'M60 2 C48 2 44 12 44 20 C44 28 48 34 53 37 L53 44 C40 46 26 48 21 56 C18 66 23 80 27 96 C29 106 28 118 29 130 C30 142 34 154 44 161 C50 165 55 165 60 165 C65 165 70 165 76 161 C86 154 90 142 91 130 C92 118 91 106 93 96 C97 80 102 66 99 56 C94 48 80 46 67 44 L67 37 C72 34 76 28 76 20 C76 12 72 2 60 2 Z';

        function buildTorso(highlightId) {
            const target = organsData.find(o => o.id === highlightId);
            // El órgano destacado se dibuja el último para que quede por encima
            const ordered = [
                ...organsData.filter(o => o.id !== highlightId),
                target
            ];
            const organs = ordered
                .map(o => `<g opacity="${o.id === highlightId ? 1 : 0.2}">${o.draw}</g>`)
                .join('');
            return `<svg viewBox="0 0 120 170" role="img" aria-label="Torso humano con ${target.name} destacado"><path d="${TORSO_PATH}" fill="#e9eef2" stroke="#9aa7b0" stroke-width="1.5" stroke-linejoin="round"/>${organs}</svg>`;
        }

        let cards = [];
        let flippedCards = [];
        let lockBoard = false;
        let hasStarted = false;
        let startTime = null;
        let timerInterval = null;
        let elapsedTime = 0;
        let lastPlayedTimestamp = null; // Para identificar el tiempo exacto de la última partida terminada

        const grid = document.getElementById('game-grid');
        const timerElement = document.getElementById('timer');
        const winnerText = document.getElementById('winner-text');
        const scoresContainer = document.getElementById('scores-container');

        function shuffle(array) {
            return array.sort(() => Math.random() - 0.5);
        }

        function initGame() {
            // Detener temporizador anterior si existe
            if (timerInterval) clearInterval(timerInterval);
            
            grid.innerHTML = '';
            flippedCards = [];
            lockBoard = false;
            hasStarted = false;
            elapsedTime = 0;
            timerElement.textContent = '00.00s';
            winnerText.textContent = '';

            const imageCards = organsData.map(o => ({ ...o, type: 'image' }));
            const textCards = organsData.map(o => ({ ...o, type: 'text' }));
            
            cards = shuffle([...imageCards, ...textCards]);

            cards.forEach((organ, index) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.id = organ.id;
                card.dataset.type = organ.type;
                card.dataset.index = index;

                const cardBackContent = organ.type === 'image' 
                    ? buildTorso(organ.id) 
                    : `<span>${organ.name}</span>`;

                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">🧬</div>
                        <div class="card-back type-${organ.type}">
                            ${cardBackContent}
                        </div>
                    </div>
                `;
                
                card.addEventListener('click', flipCard);
                grid.appendChild(card);
            });

            renderHighScores();
        }

        function startTimer() {
            if (hasStarted) return;
            hasStarted = true;
            startTime = Date.now();
            timerInterval = setInterval(() => {
                elapsedTime = (Date.now() - startTime) / 1000;
                timerElement.textContent = elapsedTime.toFixed(2) + 's';
            }, 50);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function flipCard() {
            if (lockBoard) return;
            if (this.classList.contains('flipped')) return;
            if (flippedCards.length === 1 && this.dataset.index === flippedCards[0].dataset.index) return;

            if (!hasStarted) {
                startTimer();
            }

            this.classList.add('flipped');
            flippedCards.push(this);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            lockBoard = true;
            const [card1, card2] = flippedCards;
            const isMatch = (card1.dataset.id === card2.dataset.id) && (card1.dataset.type !== card2.dataset.type);

            if (isMatch) {
                resetTurn();
            } else {
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    resetTurn();
                }, 1000);
            }
        }

        function resetTurn() {
            flippedCards = [];
            lockBoard = false;
            checkGameOver();
        }

        function checkGameOver() {
            const allFlipped = document.querySelectorAll('.card.flipped').length;
            if (allFlipped === cards.length) {
                stopTimer();
                const finalTime = parseFloat(elapsedTime.toFixed(2));
                lastPlayedTimestamp = Date.now(); // Guardamos identificador único temporal para la última partida
                
                winnerText.textContent = `🎉 ¡Completado en ${finalTime}s!`;
                
                saveScore(finalTime, lastPlayedTimestamp);
                renderHighScores();
            }
        }

        function saveScore(time, timestamp) {
            let scores = JSON.parse(localStorage.getItem('digestive_high_scores_v2') || '[]');
            scores.push({ time, timestamp, date: new Date().toLocaleDateString() });
            // Ordenar de menor a mayor tiempo
            scores.sort((a, b) => a.time - b.time);
            // Quedarse con los 10 mejores
            scores = scores.slice(0, 10);
            localStorage.setItem('digestive_high_scores_v2', JSON.stringify(scores));
        }

        function renderHighScores() {
            const scores = JSON.parse(localStorage.getItem('digestive_high_scores_v2') || '[]');
            
            if (scores.length === 0) {
                scoresContainer.innerHTML = `<p class="text-gray-400 text-sm italic text-center py-4">No hay récords todavía.</p>`;
                return;
            }

            let html = `<ul class="divide-y divide-slate-100">`;
            scores.forEach((entry, idx) => {
                const isLastPlayed = entry.timestamp === lastPlayedTimestamp;
                const rowClass = isLastPlayed 
                    ? 'bg-emerald-50 text-emerald-700 font-bold border-l-4 border-emerald-500 pl-2' 
                    : 'text-slate-700';

                html += `
                    <li class="py-2.5 flex justify-between items-center text-sm ${rowClass}">
                        <span class="flex items-center gap-2">
                            <span class="w-6 text-gray-400 font-semibold">#${idx + 1}</span>
                            <span>${entry.time.toFixed(2)}s</span>
                        </span>
                        <span class="text-xs text-gray-400">${entry.date || ''}</span>
                    </li>
                `;
            });
            html += `</ul>`;
            scoresContainer.innerHTML = html;
        }

        function clearScores() {
            localStorage.removeItem('digestive_high_scores_v2');
            lastPlayedTimestamp = null;
            renderHighScores();
        }

        // Inicializar el juego al cargar la página
        initGame();
    </script>
</body>
</html>
