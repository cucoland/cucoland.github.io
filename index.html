        <style>
            :root {
                --bg: #f2f4f7;
                --btn: #ffffff;
                --btn-hover: #ecffeb;
                --ink: #5b6776;
                --ink-hover: #34a27d;
                --border: #e6e6e6;
                --border-hover: #adffd9;
                --gap: 12px;
                --size: 100px;
                --max-width: 700px;
                --fade: linear-gradient(
            to left,
            #8efbaf,
            #d6d8ff
            );
                --cubos:rgba(255, 248, 46, 0.5);
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #141a22;
                    --btn: #202a36;
                    --btn-hover: #ecffeb;
                    --ink: #e6ebf2;
                    --ink-hover: #34a27d;
                    --border: #354964;
                    --border-hover: #adffd9;
                --fade: linear-gradient(
            to left,
            #60a475,
            #585865
            );
                --cubos:rgba(35, 199, 115, 0.5);
                }
            }
            *, *::before, *::after {
                box-sizing: border-box;
            }
            html, body {
                margin: 0;
                min-height: 100%;
            }
            body {
                background: var(--bg);
                padding: 50px 16px;
                font-family: system-ui, sans-serif;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, var(--size));
                gap: var(--gap);
                justify-content: center;
                max-width: var(--max-width);
                margin: 0 auto;
                width: 100%;
                /* Asegura que no sobrepase el ancho disponible */
            }
            .grid a {
                display: block;
                text-decoration: none;
            }


	.btn {
            	animation: flotar 3s ease-in-out infinite;
	}
        .btn2 {
            	animation: flotar 3s ease-in-out infinite;
            animation-delay: 1.5s; 
        }


            .btn, .btn2 {
                width: var(--size);
                height: var(--size);
                padding: 10px 6px 6px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 8px;
                background: var(--btn);
                color: var(--ink);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                cursor: pointer;
                font-family: inherit;
                text-decoration: none;
                transition: background .15s, color .15s, transform .15s;

            }




            .btn:hover, .btn2:hover{
                background: var(--btn-hover);
                color: var(--ink-hover);
                border-color: var(--border-hover);
            	transform: scale(1.05);
            	box-shadow: 0 15px 20px rgba(0, 123, 255, 0.4);
            }
            .btn:active, .btn2:active {
                transform: scale(.96);
            }
            .btn:focus-visible, .btn2:focus-visible {
                outline: 3px solid var(--btn-hover);
                outline-offset: 2px;
            }
            .btn svg, .btn2 svg {
                flex: none;
                width: 40px;
                height: 40px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.7;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            /* Nombre: 8px, máximo 2 líneas (si es más largo se corta con "…") */
            .btn .name, .btn2 .name {
                width: 100%;
                font-size: 12px;
                line-height: 1.25;
                text-align: center;
                overflow: hidden;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                overflow-wrap: anywhere;
            }

            .btn:hover, .name:hover {
                font-weight: 500;
            }
/* botones con efecto delay




            /* Fondo animado */
            body {
                position: relative;
                isolation: isolate;
                overflow-x: hidden;
            }
            /* Capa que ocupa toda la pantalla */
            .area {
                position: fixed;
                inset: 0;
                overflow: hidden;
                z-index: 0;
                pointer-events: none;
                background: var(--fade);
            }
            /* Contenedor de los círculos */
            .circles {
                position: absolute;
                inset: 0;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .circles li {
                position: absolute;
                display: block;
                width: 20px;
                height: 20px;
                bottom: -150px;
                background: var(--cubos);
                animation: animate 5s linear infinite;
            }
            /* Tamaños y posiciones */
            .circles li:nth-child(1) {
                left: 25%;
                width: 80px;
                height: 80px;
                animation-delay: 0s;
            }
            .circles li:nth-child(2) {
                left: 10%;
                animation-delay: 5s;
                animation-duration: 12s;
            }
            .circles li:nth-child(3) {
                left: 70%;
                width: 20px;
                height: 20px;
                animation-delay: 4s;
            }
            .circles li:nth-child(4) {
                left: 40%;
                width: 60px;
                height: 60px;
                animation-duration: 18s;
            }
            .circles li:nth-child(5) {
                left: 65%;
                animation-delay: 0s;
            }
            .circles li:nth-child(6) {
                left: 75%;
                width: 110px;
                height: 110px;
                animation-delay: 3s;
            }
            .circles li:nth-child(7) {
                left: 35%;
                width: 150px;
                height: 150px;
                animation-delay: 7s;
            }
            .circles li:nth-child(8) {
                left: 50%;
                width: 25px;
                height: 25px;
                animation-delay: 15s;
                animation-duration: 45s;
            }
            .circles li:nth-child(9) {
                left: 20%;
                width: 15px;
                height: 15px;
                animation-delay: 2s;
                animation-duration: 35s;
            }
            .circles li:nth-child(10) {
                left: 85%;
                width: 150px;
                height: 150px;
                animation-delay: 0s;
                animation-duration: 11s;
            }
            /* Movimiento de las figuras */
            @keyframes animate {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                    border-radius: 0;
                }
                100% {
                    transform: translateY(-1000px) rotate(720deg);
                    opacity: 0;
                    border-radius: 100%;
                }
            }


 /* Definición de la animación de arriba a abajo */
        @keyframes flotar {
            0% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-2px); /* Sube 20 píxeles */
            }
            100% {
                transform: translateY(0px);
            }
        }


            /* Mantiene los botones por delante del fondo */
            .grid {
                position: relative;
                z-index: 1;
            }
        </style>
