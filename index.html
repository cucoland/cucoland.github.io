<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botonera Simple</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f9;
            margin: 0;
        }

        .botonera {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 columnas */
            gap: 15px; /* Espacio entre botones */
            max-width: 600px;
            padding: 20px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn {
            display: inline-block;
            text-decoration: none;
            color: #ffffff;
            background-color: #007bff;
            padding: 15px 25px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        /* Efecto al pasar el cursor */
        .btn:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        /* Efecto al hacer clic */
        .btn:active {
            transform: translateY(0);
        }

        /* Responsivo: 2 columnas en pantallas medianas y 1 en pantallas pequeñas */
        @media (max-width: 600px) {
            .botonera {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 400px) {
            .botonera {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="botonera">
        <a href="https://cucoland.github.io/cromos/" target="_blank" class="btn">Cromos</a>
        <a href="https://cucoland.github.io/cromos/repes/" target="_blank" class="btn">Repes</a>
        <a href="https://cucoland.github.io/lasermirror/" target="_blank" class="btn">Lasermirror</a>
        <a href="https://cucoland.github.io/reproductor/" target="_blank" class="btn">MP3</a>
        <a href="https://cucoland.github.io/radio/" target="_blank" class="btn">Radio</a>
        
        <a href="https://cucoland.github.io/cursos/" target="_blank" class="btn">Cursos</a>
        <a href="https://cucoland.github.io/geometria/troncos.html" target="_blank" class="btn">Geometría</a>
    </div>

</body>
</html>
