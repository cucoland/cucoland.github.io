<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>
            Index
        </title>
        <style>
            :root {
                --bg: #f2f4f7;
                --btn: #ffffff;
                --btn-hover: #ecffeb;
                --ink: #5b6776;
                --ink-hover: #34a27d;
                --border: #e6e6e6;
                --border-hover: #adffd9;
                --gap: 12px;
                --size: 100px;
                --max-width: 700px;
                --fade: linear-gradient(
            to left,
            #8efbaf,
            #d6d8ff
            );
                --cubos:rgba(255, 248, 46, 0.5);
                --error-bg: #fff1f2;
                --error-border: #fda4af;
                --error-ink: #e11d48;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #141a22;
                    --btn: #202a36;
                    --btn-hover: #ecffeb;
                    --ink: #e6ebf2;
                    --ink-hover: #34a27d;
                    --border: #354964;
                    --border-hover: #adffd9;
                --fade: linear-gradient(
            to left,
            #60a475,
            #585865
            );
                --cubos:rgba(35, 199, 115, 0.5);
                    --error-bg: rgba(159, 18, 57, 0.25);
                    --error-border: #fb7185;
                    --error-ink: #fda4af;
                }
            }
            *, *::before, *::after {
                box-sizing: border-box;
            }
            html, body {
                margin: 0;
                min-height: 100%;
            }
            body {
                background: var(--bg);
                padding: 50px 16px;
                font-family: system-ui, sans-serif;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, var(--size));
                gap: var(--gap);
                justify-content: center;
                max-width: var(--max-width);
                margin: 0 auto;
                width: 100%;
                /* Asegura que no sobrepase el ancho disponible */
            }
            .grid a {
                display: block;
                text-decoration: none;
            }


            .btn {
                animation: flotar 3s ease-in-out infinite;
            }
            .btn2 {
                animation: flotar 3s ease-in-out infinite;
                animation-delay: 1.5s; 
            }


            .btn, .btn2 {
                width: var(--size);
                height: var(--size);
                padding: 10px 6px 6px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-start;
                gap: 8px;
                background: var(--btn);
                color: var(--ink);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                cursor: pointer;
                font-family: inherit;
                text-decoration: none;
                transition: background .15s, color .15s, transform .15s;
            }

            .btn:hover, .btn2:hover {
                background: var(--btn-hover);
                color: var(--ink-hover);
                border-color: var(--border-hover);
                transform: scale(1.05);
                box-shadow: 0 15px 20px rgba(0, 123, 255, 0.4);
            }
            .btn:active, .btn2:active {
                transform: scale(.96);
            }
            .btn:focus-visible, .btn2:focus-visible {
                outline: 3px solid var(--btn-hover);
                outline-offset: 2px;
            }
            .btn svg, .btn2 svg {
                flex: none;
                width: 40px;
                height: 40px;
                fill: none;
                stroke: currentColor;
                stroke-width: 1.7;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            /* Nombre: 8px, máximo 2 líneas (si es más largo se corta con "…") */
            .btn .name, .btn2 .name {
                width: 100%;
                font-size: 12px;
                line-height: 1.25;
                text-align: center;
                overflow: hidden;
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 2;
                line-clamp: 2;
                overflow-wrap: anywhere;
            }

            .btn:hover, .name:hover {
                font-weight: 500;
            }

            /* Fondo animado */
            body {
                position: relative;
                isolation: isolate;
                overflow-x: hidden;
            }
            /* Capa que ocupa toda la pantalla */
            .area {
                position: fixed;
                inset: 0;
                overflow: hidden;
                z-index: 0;
                pointer-events: none;
                background: var(--fade);
            }
            /* Contenedor de los círculos */
            .circles {
                position: absolute;
                inset: 0;
                margin: 0;
                padding: 0;
                list-style: none;
            }
            .circles li {
                position: absolute;
                display: block;
                width: 20px;
                height: 20px;
                bottom: -150px;
                background: var(--cubos);
                animation: animate 5s linear infinite;
            }
            /* Tamaños y posiciones */
            .circles li:nth-child(1) {
                left: 25%;
                width: 80px;
                height: 80px;
                animation-delay: 0s;
            }
            .circles li:nth-child(2) {
                left: 10%;
                animation-delay: 5s;
                animation-duration: 12s;
            }
            .circles li:nth-child(3) {
                left: 70%;
                width: 20px;
                height: 20px;
                animation-delay: 4s;
            }
            .circles li:nth-child(4) {
                left: 40%;
                width: 60px;
                height: 60px;
                animation-duration: 18s;
            }
            .circles li:nth-child(5) {
                left: 65%;
                animation-delay: 0s;
            }
            .circles li:nth-child(6) {
                left: 75%;
                width: 110px;
                height: 110px;
                animation-delay: 3s;
            }
            .circles li:nth-child(7) {
                left: 35%;
                width: 150px;
                height: 150px;
                animation-delay: 7s;
            }
            .circles li:nth-child(8) {
                left: 50%;
                width: 25px;
                height: 25px;
                animation-delay: 15s;
                animation-duration: 45s;
            }
            .circles li:nth-child(9) {
                left: 20%;
                width: 15px;
                height: 15px;
                animation-delay: 2s;
                animation-duration: 35s;
            }
            .circles li:nth-child(10) {
                left: 85%;
                width: 150px;
                height: 150px;
                animation-delay: 0s;
                animation-duration: 11s;
            }
            /* Movimiento de las figuras */
            @keyframes animate {
                0% {
                    transform: translateY(0) rotate(0deg);
                    opacity: 1;
                    border-radius: 0;
                }
                100% {
                    transform: translateY(-1000px) rotate(720deg);
                    opacity: 0;
                    border-radius: 100%;
                }
            }

            /* Definición de la animación de arriba a abajo */
            @keyframes flotar {
                0% {
                    transform: translateY(0px);
                }
                50% {
                    transform: translateY(-2px);
                }
                100% {
                    transform: translateY(0px);
                }
            }

            /* Mantiene los botones por delante del fondo */
            .grid {
                position: relative;
                z-index: 1;
            }

            /* --- Estilos adaptados para el formulario de ID dentro de .grid --- */
            .id-card {
                grid-column: 1 / -1;
                width: 100%;
                max-width: 380px;
                justify-self: center;
                background: var(--btn);
                color: var(--ink);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                padding: 20px;
                display: flex;
                flex-direction: column;
                gap: 12px;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.06);
                transition: border-color .15s, box-shadow .15s;
            }

            .id-card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
            }

            .id-label {
                color: var(--ink-hover);
                font-weight: 600;
                font-size: 14px;
            }

            .id-attempts {
                font-size: 11px;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 999px;
                background: var(--error-bg);
                color: var(--error-ink);
                border: 1px solid var(--error-border);
            }

            .id-input-row {
                display: flex;
                gap: 8px;
                align-items: stretch;
            }

            .id-input-wrap {
                position: relative;
                flex: 1;
                display: flex;
                align-items: center;
            }

            .id-input {
                width: 100%;
                height: 44px;
                padding: 0 32px 0 12px;
                border: 1.5px solid var(--border);
                border-radius: 14px;
                background-color: var(--btn-hover);
                color: #202a36;
                font-family: inherit;
                font-size: 14px;
                outline: none;
                transition: border-color .15s, box-shadow .15s, background-color .15s;
            }

            .id-input::placeholder {
                color: #7c8b99;
            }

            .id-input:focus {
                border-color: var(--border-hover);
                box-shadow: 0 0 0 3px rgba(173, 255, 217, 0.45);
            }

            .id-input.is-error {
                border-color: var(--error-border);
            }

            .id-clear {
                position: absolute;
                right: 8px;
                width: 24px;
                height: 24px;
                border: none;
                background: transparent;
                color: #5b6776;
                font-size: 16px;
                line-height: 1;
                border-radius: 8px;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: background .15s, color .15s;
            }

            .id-clear:hover {
                background: rgba(0, 0, 0, 0.08);
                color: #141a22;
            }

            .id-submit {
                height: 44px;
                padding: 0 16px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                background: var(--btn);
                color: var(--ink);
                border: 1.5px solid var(--border);
                border-radius: 14px;
                cursor: pointer;
                font-family: inherit;
                font-size: 13px;
                font-weight: 600;
                transition: background .15s, color .15s, transform .15s, border-color .15s, box-shadow .15s;
                animation: flotar 3s ease-in-out infinite;
            }

            .id-submit:hover {
                background: var(--btn-hover);
                color: var(--ink-hover);
                border-color: var(--border-hover);
                transform: scale(1.04);
                box-shadow: 0 8px 15px rgba(0, 123, 255, 0.25);
            }

            .id-submit:active {
                transform: scale(0.96);
            }

            .id-error-msg {
                padding: 10px 12px;
                border-radius: 12px;
                background: var(--error-bg);
                border: 1px solid var(--error-border);
                color: var(--error-ink);
                font-size: 12.5px;
                line-height: 1.4;
                display: flex;
                align-items: flex-start;
                gap: 8px;
            }

            .id-error-msg svg {
                width: 16px;
                height: 16px;
                flex: none;
                margin-top: 1px;
                stroke: currentColor;
                fill: none;
                stroke-width: 2;
                stroke-linecap: round;
                stroke-linejoin: round;
            }

            .hidden {
                display: none !important;
            }

            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                25%, 75% { transform: translateX(-5px); }
                50% { transform: translateX(5px); }
            }

            .shake {
                animation: shake 0.3s ease-in-out;
            }
        </style>
    </head>
    <body>
        <div class="area" aria-hidden="true">
            <ul class="circles">
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </div>

        <main class="grid">
            <form id="idForm" class="id-card" novalidate>
                <div class="id-card-header">
                    <label for="idInput" class="id-label">Introduce id</label>
                    <span id="idAttempts" class="id-attempts hidden">Intentos: 0</span>
                </div>

                <div class="id-input-row">
                    <div class="id-input-wrap">
                        <input
                            type="text"
                            id="idInput"
                            class="id-input"
                            placeholder="Escribe tu ID..."
                            autocomplete="off"
                            spellcheck="false"
                            autofocus
                        >
                        <button
                            type="button"
                            id="idClear"
                            class="id-clear hidden"
                            title="Limpiar ID"
                            aria-label="Limpiar ID"
                        >&times;</button>
                    </div>
                    <button type="submit" class="id-submit">Verificar</button>
                </div>

                <div id="idError" class="id-error-msg hidden" role="alert" aria-live="assertive">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="8" x2="12" y2="12"></line>
                        <line x1="12" y1="16" x2="12.01" y2="16"></line>
                    </svg>
                    <span id="idErrorText">ID erróneo. Por favor, introduce otro ID.</span>
                </div>
            </form>
        </main>

        <script>
            document.addEventListener('DOMContentLoaded', () => {
                const form = document.getElementById('idForm');
                const input = document.getElementById('idInput');
                const clearBtn = document.getElementById('idClear');
                const errorBox = document.getElementById('idError');
                const errorText = document.getElementById('idErrorText');
                const attemptsBadge = document.getElementById('idAttempts');

                let intentos = 0;

                function toggleClearBtn() {
                    clearBtn.classList.toggle('hidden', input.value.length === 0);
                }

                form.addEventListener('submit', (e) => {
                    e.preventDefault();
                    intentos++;

                    const valor = input.value.trim();
                    attemptsBadge.textContent = `Intentos: ${intentos}`;
                    attemptsBadge.classList.remove('hidden');

                    if (valor === '') {
                        errorText.textContent = 'ID erróneo: el campo está vacío. Introduce un ID para volver a intentarlo.';
                    } else {
                        errorText.textContent = `ID erróneo: "${valor}" no es válido. Introduce otro ID.`;
                    }

                    input.classList.add('is-error');
                    errorBox.classList.remove('hidden');

                    // Efecto de sacudida en la tarjeta
                    form.classList.remove('shake');
                    void form.offsetWidth;
                    form.classList.add('shake');

                    // Mantiene el foco y selecciona el texto para escribir otro ID al instante
                    input.focus();
                    if (input.value.length > 0) {
                        input.select();
                    }
                });

                input.addEventListener('input', toggleClearBtn);

                clearBtn.addEventListener('click', () => {
                    input.value = '';
                    toggleClearBtn();
                    input.focus();
                });
            });
        </script>
    </body>
</html>
