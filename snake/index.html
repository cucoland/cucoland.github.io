<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Neon Pro 2026</title>
    <style>
        :root { --bg: #050505; --panel: #111; --snake: #00ffcc; --food: #ff0055; }
        body { 
            margin: 0; background: var(--bg); color: white; overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; touch-action: none;
        }
        .ui-top { text-align: center; padding: 15px; width: 100%; background: linear-gradient(to bottom, #111, transparent); }
        .controls-panel { 
            background: var(--panel); padding: 10px; border-radius: 10px; border: 1px solid #333;
            margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; align-items: center;
        }
        .game-wrapper { position: relative; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        canvas { 
            border: 2px solid #333; background: #000; border-radius: 5px;
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.1); max-width: 90vw; max-height: 65vh;
        }
        .stats-box { 
            background: var(--panel); padding: 20px; border-radius: 10px; min-width: 160px;
            border: 1px solid #222; text-transform: uppercase;
        }
        .stat-item { margin-bottom: 15px; }
        .stat-label { font-size: 0.7rem; color: #666; letter-spacing: 2px; }
        .stat-val { font-size: 1.8rem; font-weight: bold; color: var(--snake); display: block; text-shadow: 0 0 10px var(--snake); }
        .high-score { color: #f1c40f !important; text-shadow: 0 0 10px #f1c40f !important; }
        button { 
            padding: 10px 25px; border: none; border-radius: 4px; 
            background: var(--snake); color: black; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        button:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--snake); }
        select { background: #222; color: white; border: 1px solid #444; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<div class="ui-top">
    <h1 style="margin:0; letter-spacing: 5px; color: var(--snake);">NEON SNAKE</h1>
</div>

<div class="controls-panel">
    <div><label>GRID:</label>
        <select id="gridSize"><option value="15">15x15</option><option value="20" selected>20x20</option><option value="30">30x30</option></select>
    </div>
    <div><label>DIF:</label>
        <select id="diff"><option value="200">Fácil</option><option value="130" selected>Normal</option><option value="80">Hardcore</option></select>
    </div>
    <button onclick="initGame()">RESET</button>
</div>

<div class="game-wrapper">
    <canvas id="gameCanvas"></canvas>
    
    <div class="stats-box">
        <div class="stat-item">
            <span class="stat-label">RECORDE</span>
            <span id="bestScore" class="stat-val high-score">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">SCORE</span>
            <span id="score" class="stat-val">0</span>
        </div>
        <div class="stat-item">
            <span class="stat-label">TIEMPO</span>
            <span id="timer" class="stat-val" style="color:#fff; text-shadow:none;">0s</span>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    let snake, food, dir, nextDir, loop, timerInterval;
    let score = 0, seconds = 0, currentSpeed = 0, grid, tile;

    // --- Audio Sintetizado ---
    function playSound(freq, type, duration) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    // --- Controles (Touch + Keyboard) ---
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener("touchstart", e => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, false);
    window.addEventListener("touchend", e => {
        const dx = e.changedTouches[0].screenX - touchStartX;
        const dy = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(dx) > Math.abs(dy)) {
            if (dx > 30 && dir.x === 0) nextDir = {x: 1, y: 0};
            else if (dx < -30 && dir.x === 0) nextDir = {x: -1, y: 0};
        } else {
            if (dy > 30 && dir.y === 0) nextDir = {x: 0, y: 1};
            else if (dy < -30 && dir.y === 0) nextDir = {x: 0, y: -1};
        }
    }, false);

    window.addEventListener("keydown", e => {
        const keys = {ArrowUp: {x:0, y:-1}, ArrowDown: {x:0, y:1}, ArrowLeft: {x:-1, y:0}, ArrowRight: {x:1, y:0}};
        if (keys[e.key] && (keys[e.key].x !== -dir.x || keys[e.key].y !== -dir.y)) nextDir = keys[e.key];
    });

    // --- Lógica ---
    function initGame() {
        grid = parseInt(document.getElementById("gridSize").value);
        currentSpeed = parseInt(document.getElementById("diff").value);
        tile = Math.floor(Math.min(window.innerWidth * 0.9, 450) / grid);
        canvas.width = canvas.height = grid * tile;
        
        snake = [{x: 5, y: 5}];
        dir = {x: 0, y: 0}; nextDir = {x: 0, y: 0};
        score = 0; seconds = 0;
        
        document.getElementById("bestScore").innerText = localStorage.getItem("snakeBest") || 0;
        document.getElementById("score").innerText = "0";
        document.getElementById("timer").innerText = "0s";
        
        spawnFood();
        if (loop) clearTimeout(loop);
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => { if(dir.x !== 0 || dir.y !== 0) { seconds++; document.getElementById("timer").innerText = seconds + "s"; }}, 1000);
        run();
    }

    function run() {
        dir = nextDir;
        const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

        if (dir.x !== 0 || dir.y !== 0) {
            if (head.x < 0 || head.x >= grid || head.y < 0 || head.y >= grid || snake.some(s => s.x === head.x && s.y === head.y)) {
                playSound(150, 'sawtooth', 0.5);
                if (score > (localStorage.getItem("snakeBest") || 0)) localStorage.setItem("snakeBest", score);
                alert("FIN DEL JUEGO");
                return initGame();
            }

            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score++;
                document.getElementById("score").innerText = score;
                playSound(800 + (score * 20), 'sine', 0.1);
                currentSpeed = Math.max(50, currentSpeed * 0.96);
                spawnFood();
            } else {
                snake.pop();
            }
        }

        draw();
        loop = setTimeout(run, currentSpeed);
    }

    function draw() {
        ctx.fillStyle = "rgba(0,0,0,0.3)"; // Efecto estela
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Comida con pulso
        ctx.shadowBlur = 15; ctx.shadowColor = "#ff0055";
        ctx.fillStyle = "#ff0055";
        ctx.beginPath();
        ctx.arc((food.x * tile) + tile/2, (food.y * tile) + tile/2, tile/2.5, 0, Math.PI*2);
        ctx.fill();

        // Serpiente Neon
        snake.forEach((seg, i) => {
            ctx.shadowBlur = i === 0 ? 20 : 10;
            ctx.shadowColor = i === 0 ? "#fff" : "#00ffcc";
            ctx.fillStyle = i === 0 ? "#fff" : "#00ffcc";
            ctx.fillRect(seg.x * tile + 1, seg.y * tile + 1, tile - 2, tile - 2);
        });
        ctx.shadowBlur = 0;
    }

    function spawnFood() {
        food = { x: Math.floor(Math.random() * grid), y: Math.floor(Math.random() * grid) };
        if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    initGame();
</script>
</body>
</html>
