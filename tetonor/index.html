<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Meta tag para responsive -->
 <title>Tetonor Pro Web - Con Solución & Contadores</title>
 <style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 10px; background-color: #f0f2f5; color: #333; }
  .config-panel { background: white; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #ddd; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
  .config-panel input { width: 50px; padding: 5px; margin-right: 10px; border: 1px solid #ccc; border-radius: 4px; }
  
  /* Grid de Desafíos - 3 columnas */
  .game-grid { 
display: grid; 
grid-template-columns: repeat(3, 1fr); /* 3 columnas iguales */
gap: 15px; 
max-width: 900px; 
margin: auto;
  }

  .block { 
border: 2px solid #444; 
background: white; 
border-radius: 8px; 
overflow: hidden; 
display: flex; 
flex-direction: column; 
/* Aspecto cuadrado aproximado con padding/margin */
  }
  .target-cell { 
background-color: rgb(190, 215, 235); 
text-align: center; 
font-weight: bold; 
font-size: 1.2em; 
padding: 10px 5px;
border-bottom: 2px solid #444;
  }
  .input-row { display: flex; background: #fff; flex-grow: 1; }
  .input-row input { 
width: 33.3%; 
text-align: center; 
padding: 8px 0; 
border: none; 
font-weight: bold;
font-size: 1em;
outline: none;
  }
  .operator { 
background-color: rgb(245, 245, 245); 
border-left: 1px solid #eee; 
border-right: 1px solid #eee; 
color: #555;
cursor: help; /* Indica que se rellena automáticamente */
  }

  /* Números Base */
  .base-container { margin-top: 25px; background: white; padding: 15px; border-radius: 12px; border: 1px solid #ddd; max-width: 900px; margin-left: auto; margin-right: auto; }
  .base-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; justify-content: center; }
  .base-cell { 
flex-grow: 1; 
min-width: 50px; /* Tamaño mínimo flexible */
max-width: 70px;
height: 50px; 
display: flex; 
align-items: center; 
justify-content: center; 
border: 2px solid #666; 
font-weight: bold; 
border-radius: 6px;
font-size: 1em;
position: relative;
  }
  .counter-badge {
    position: absolute;
    bottom: -8px;
    right: -8px;
    background-color: #e74c3c;
    color: white;
    border-radius: 50%;
    padding: 2px 6px;
    font-size: 0.7em;
    min-width: 15px;
    text-align: center;
  }
  .counter-badge.sum { background-color: #8e44ad; }
  .counter-badge.mult { background-color: #2980b9; }

  /* Sección de Solución */
  #solution-section { display: none; margin-top: 25px; padding: 15px; background: #fff3cd; border: 2px dashed #856404; border-radius: 12px; color: #856404; max-width: 900px; margin-left: auto; margin-right: auto; }
  .sol-item { display: inline-block; margin-right: 10px; font-weight: bold; padding: 3px; font-size: 0.9em; }

  /* Botones */
  .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
  button { padding: 8px 18px; cursor: pointer; border: none; border-radius: 6px; font-weight: bold; transition: 0.3s; font-size: 0.9em; }
  .btn-gen { background: #007bff; color: white; }
  .btn-gen:hover { background: #0056b3; }
  .btn-val { background: #28a745; color: white; }
  .btn-val:hover { background: #218838; }
  .btn-sol { background: #ffc107; color: #333; }
  .btn-sol:hover { background: #e0a800; }

  /* Media query para asegurar visibilidad en pantallas pequeñas */
  @media (max-width: 600px) {
    .game-grid { grid-template-columns: repeat(2, 1fr); }
    .base-cell { min-width: 40px; height: 40px; font-size: 0.9em; }
    body { padding: 5px; }
  }
 </style>
</head>
<body>

 <div class="config-panel">
  <div style="margin-bottom: 15px;">
<strong>Mín:</strong> <input type="number" id="minVal" value="1">
<strong>Máx:</strong> <input type="number" id="maxVal" value="20">
<strong>Visibles:</strong> <input type="number" id="visibles" value="6">
  </div>
  <div class="btn-group">
<button class="btn-gen" onclick="generarJuego()">Generar Tetonor Pro</button>
<button class="btn-val" onclick="validarJuego()">Validar Juego</button>
<button class="btn-sol" id="btnToggleSol" onclick="toggleSolucion()">Ver Solución</button>
  </div>
 </div>

 <div id="game-board" class="game-grid"></div>

 <div class="base-container">
  <strong>NÚMEROS DISPONIBLES:</strong>
  <div id="base-numbers" class="base-grid"></div>
 </div>

 <div id="solution-section">
  <h3>SOLUCIÓN</h3>
  <div id="solution-text"></div>
 </div>

 <script>
  let startTime;
  let solutionData = [];
  let juegoActivo = false;
  let baseNumbersWithCounters = []; // Array de objetos para gestionar los contadores

  function generarJuego() {
const min = parseInt(document.getElementById('minVal').value);
const max = parseInt(document.getElementById('maxVal').value);
const numVisibles = parseInt(document.getElementById('visibles').value);

if (min >= max) return alert("El mínimo debe ser menor al máximo");

let rawBase = [];
let objectives = [];
solutionData = [];

for (let i = 0; i < 6; i++) {
 let nA = Math.floor(Math.random() * (max - min + 1)) + min;
 let nB = Math.floor(Math.random() * (max - min + 1)) + min;
 rawBase.push(nA, nB);
 objectives.push({ target: nA * nB, a: nA, b: nB, op: 'x' });
 objectives.push({ target: nA + nB, a: nA, b: nB, op: '+' });
}

objectives.sort(() => Math.random() - 0.5);
solutionData = [...objectives];

let baseSorted = [...rawBase].sort((a, b) => a - b);
let indices = Array.from({length: 12}, (_, i) => i).sort(() => Math.random() - 0.5);
let visibleMask = new Array(12).fill(false);
for(let i=0; i < Math.min(numVisibles, 12); i++) visibleMask[indices[i]] = true;

// Inicializar baseNumbersWithCounters con la nueva estructura
baseNumbersWithCounters = baseSorted.map((num, i) => ({
  value: num,
  isVisible: visibleMask[i],
  usesSum: 0,
  usesMult: 0,
  element: null // Para referencia al elemento DOM
}));

const board = document.getElementById('game-board');
board.innerHTML = '';
objectives.forEach((obj, index) => {
 board.innerHTML += `
  <div class="block">
<div class="target-cell">${obj.target}</div>
<div class="input-row">
 <input type="number" class="valA" oninput="validarJuego()">
 <input type="text" class="operator" readonly placeholder="?">
 <input type="number" class="valB" oninput="validarJuego()">
</div>
  </div>
 `;
});

actualizarBaseDisplay();

// Preparar texto de solución
document.getElementById('solution-text').innerHTML = solutionData
 .map(s => `<span class="sol-item">${s.target} = ${s.a} ${s.op} ${s.b}</span>`)
 .join('');

document.getElementById('solution-section').style.display = 'none';
document.getElementById('btnToggleSol').innerText = "Ver Solución";

startTime = new Date();
juegoActivo = true;
  }

  function actualizarBaseDisplay() {
const baseDiv = document.getElementById('base-numbers');
baseDiv.innerHTML = '';
baseNumbersWithCounters.forEach((item, i) => {
 const cell = document.createElement('div');
 cell.classList.add('base-cell');
 cell.style.backgroundColor = item.isVisible ? 'rgb(225, 240, 210)' : 'rgb(240, 240, 240)';
 cell.innerText = item.isVisible ? item.value : '';
 
 // Añadir contadores visuales si hay usos
 if (item.usesSum > 0) {
    const sumBadge = document.createElement('span');
    sumBadge.classList.add('counter-badge', 'sum');
    sumBadge.innerText = item.usesSum;
    cell.appendChild(sumBadge);
 }
 if (item.usesMult > 0) {
    const multBadge = document.createElement('span');
    multBadge.classList.add('counter-badge', 'mult');
    multBadge.style.right = item.usesSum > 0 ? '12px' : '-8px'; // Ajuste de posición si ambos están presentes
    multBadge.innerText = item.usesMult;
    cell.appendChild(multBadge);
 }
 baseDiv.appendChild(cell);
 // Almacenar referencia al elemento DOM (aunque para este enfoque no es estrictamente necesario ya que redibujamos todo)
 item.element = cell; 
});
  }

  function validarJuego() {
if(!juegoActivo) return;
const blocks = document.querySelectorAll('.block');
let aciertos = 0;
let newUsesSum = {};
let newUsesMult = {};

// Reiniciar contadores para el nuevo cálculo
baseNumbersWithCounters.forEach(item => { item.usesSum = 0; item.usesMult = 0; });

blocks.forEach((block) => {
 const target = parseInt(block.querySelector('.target-cell').innerText);
 const valA = parseInt(block.querySelector('.valA').value);
 const valB = parseInt(block.querySelector('.valB').value);
 const opField = block.querySelector('.operator');

 opField.value = '';
 opField.style.color = '#555';

 if (!isNaN(valA) && !isNaN(valB)) {
  if (valA + valB === target) {
opField.value = '+';
opField.style.color = '#8e44ad';
aciertos++;
// Registrar uso para sumas
newUsesSum[valA] = (newUsesSum[valA] || 0) + 1;
newUsesSum[valB] = (newUsesSum[valB] || 0) + 1;
  } else if (valA * valB === target) {
opField.value = 'x';
opField.style.color = '#2980b9';
aciertos++;
// Registrar uso para multiplicaciones
newUsesMult[valA] = (newUsesMult[valA] || 0) + 1;
newUsesMult[valB] = (newUsesMult[valB] || 0) + 1;
  } 
 }
});

// Actualizar el array principal con los nuevos usos contados
baseNumbersWithCounters.forEach(item => {
    item.usesSum = newUsesSum[item.value] || 0;
    item.usesMult = newUsesMult[item.value] || 0;
});
actualizarBaseDisplay(); // Redibujar la sección de base para mostrar los contadores

if (aciertos === 12) {
 const diff = new Date(new Date() - startTime);
 const tiempoStr = diff.getUTCMinutes().toString().padStart(2, '0') + ":" + diff.getUTCSeconds().toString().padStart(2, '0');
 alert(`¡ESPECTACULAR! 🌟\nCompletado en ${tiempoStr}.`);
 document.getElementById('solution-section').style.display = 'block';
}
  }

  function toggleSolucion() {
const sol = document.getElementById('solution-section');
const btn = document.getElementById('btnToggleSol');
if (sol.style.display === 'none' || sol.style.display === '') {
 sol.style.display = 'block';
 btn.innerText = "Ocultar Solución";
} else {
 sol.style.display = 'none';
 btn.innerText = "Ver Solución";
}
  }
 </script>
</body>
</html>
