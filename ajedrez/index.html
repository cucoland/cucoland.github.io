<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajedrez</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        :root {
            --estilo-green: #58cc02;
            --board-dark: #8EA3BD;
            --board-light: #FFF6BD;
            --estilo-red: #ff8585;
            --piece-white-color: #FCFFF2; 
            --piece-black-color: #ff9600; 
        }
        body { background-color: #f0f2f5; font-family: sans-serif; overflow-x: hidden; }
        
        .perspective { perspective: 1000px; }
        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            transform: rotateX(12deg);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), 0 20px 0px -5px #bdc3c7;
            border: 12px solid #ffffff;
            border-radius: 8px;
            user-select: none;
            background-color: #bdc3c7;
        }
        .square {
            aspect-ratio: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s;
        }
        .light { background-color: var(--board-light); }
        .dark { background-color: var(--board-dark); }
        .selected { background-color: #f7e03f !important; }
        .last-move { border: 3px solid #ffffff !important; }

/* Color rojo sólido para el Jaque Mate (sin animación) */
.checkmate-alert { 
    background-color: var(--estilo-red) !important; 
    z-index: 5; 
}
/* Esto pintará el cuerpo del Rey de blanco/naranja a rojo en el mate */
.checkmate-alert .piece {
    filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.4)) sepia(1) saturate(10000%) hue-rotate(320deg);
}
        
        @keyframes pulse-red {
            0%, 100% { background-color: var(--estilo-red); }
            50% { background-color: #ff9393; }
        }
        .check-alert { animation: pulse-red 0.6s infinite; z-index: 5; }

        .dot {
            width: 24%;
            height: 24%;
            background: rgba(0,0,0,0.15);
            border-radius: 50%;
        }

        /* --- NUEVA LÓGICA DE PIEZAS --- */
.piece {
    width: 90%;
    height: 90%;
    background-size: contain;
    background-repeat: no-repeat;
    background-position: center;
    /* Sombra base: simula que la pieza está apoyada */
    filter: drop-shadow(0px 4px 3px rgba(0,0,0,0.4)); 
    z-index: 10;
    transition: all 0.2s ease-out;
}

.piece:hover {
    transform: translateY(-5px) scale(1.1);
    filter: drop-shadow(0px 12px 8px rgba(0,0,0,0.3));
}

/* Efecto al seleccionar o mover */
.piece:active { transform: scale(1.1); }



/* Las clases de color ya no necesitan background-color, se gestiona en el SVG */
.piece-white, .piece-black { background-color: transparent; }


        .btn-estilo {
            border-bottom: 4px solid #d1d1d1;
            transition: all 0.1s;
        }
        .btn-estilo:active { border-bottom-width: 0px; transform: translateY(4px); }
    </style>
</head>
<body class="flex flex-col items-center p-4">

    <div class="w-full max-w-[450px] flex justify-between items-center bg-white p-4 rounded-2xl border-b-4 border-gray-200 mb-4">
        <h1 class="text-2xl font-black text-[#58cc02] tracking-tight">♙ Ajedrez</h1>
        <div class="flex gap-2 text-xl font-bold">
            <button onclick="undoMove()" class="btn-estilo px-3 py-1 bg-white border-2 border-gray-100 rounded-xl text-gray-400">↩</button>
            <button onclick="resetGame()" class="btn-estilo px-3 py-1 bg-white border-2 border-gray-100 rounded-xl text-gray-400">↻</button>
        </div>
    </div>

    <div class="w-full max-w-[450px] flex gap-4 mb-4 font-black">
        <div id="box-b" class="flex-1 bg-white p-3 rounded-2xl border-b-4 border-gray-200 text-center transition-all">
            <div class="text-[10px] text-gray-400 uppercase tracking-widest">Negras</div>
            <div id="clock-b" class="text-xl text-gray-700">10:00</div>
        </div>
        <div id="box-w" class="flex-1 bg-[#58cc02] p-3 rounded-2xl border-b-4 border-[#46a302] text-center text-white transition-all">
            <div class="text-[10px] opacity-80 uppercase tracking-widest">Blancas</div>
            <div id="clock-w" class="text-xl">10:00</div>

        const game = new Chess();
        const boardEl = document.getElementById('board');
        let selectedSquare = null;
        let timers = { w: 600, b: 600 };
        let timerInterval;

        function renderBoard() {
            boardEl.innerHTML = '';
            const history = game.history({ verbose: true });
            const lastMove = history.length > 0 ? history[history.length - 1] : null;
            const isCheck = game.in_check();
            const turn = game.turn();

            for (let i = 0; i < 64; i++) {
                const row = Math.floor(i / 8);
                const col = i % 8;
                const squareName = String.fromCharCode(97 + col) + (8 - row);
                const squareData = game.get(squareName);                
                const squareDiv = document.createElement('div');
                const isDark = (row + col) % 2 !== 0;
                squareDiv.className = `square ${isDark ? 'dark' : 'light'}`;
const isCheckmate = game.in_checkmate(); // Detectamos si es mate
const isCheck = game.in_check();

// Lógica de alerta visual en la casilla del Rey
if (squareData && squareData.type === 'k' && squareData.color === turn) {
    if (isCheckmate) {
        // Si es jaque mate, aplicamos la clase roja fija
        squareDiv.classList.add('checkmate-alert');
    } else if (isCheck) {
        // Si es jaque normal, mantenemos el parpadeo
        squareDiv.classList.add('check-alert');
    }
}
                if (isCheck && squareData && squareData.type === 'k' && squareData.color === turn) {
                    squareDiv.classList.add('check-alert');
                }

                if (selectedSquare === squareName) squareDiv.classList.add('selected');
                if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
                    squareDiv.classList.add('last-move');
                }

if (squareData) {
    const pieceDiv = document.createElement('div');
    const colorpiezailo = squareData.color; // 'w' o 'b'
    pieceDiv.className = `piece`; 
    
    // Obtenemos el SVG inyectando el color de bando
    const svgUrl = PIECES_SVG.getSVG(squareData.type, colorpiezailo);
    pieceDiv.style.backgroundImage = `url("${svgUrl}")`;
    
    squareDiv.appendChild(pieceDiv);
}

                if (selectedSquare) {
                    const moves = game.moves({ square: selectedSquare, verbose: true });
                    if (moves.some(m => m.to === squareName)) {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        squareDiv.appendChild(dot);
                    }
                }

                squareDiv.onclick = () => onSquareClick(squareName);
                boardEl.appendChild(squareDiv);
            }
            updateStatus();
        }

        function onSquareClick(square) {
            if (game.game_over()) return;
            const piece = game.get(square);
            
            if (piece && piece.color === game.turn()) {
                selectedSquare = square;
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const move = game.move({ from: selectedSquare, to: square, promotion: 'q' });
                if (move) {
                    selectedSquare = null;
                    renderBoard();
                    if (!timerInterval) startTimer();
                } else {
                    selectedSquare = null;
                    renderBoard();
                }
            }
        }

        function updateStatus() {
            const statusEl = document.getElementById('status');
            const turn = game.turn();
            
            document.getElementById('box-w').style.opacity = turn === 'w' ? '1' : '0.5';
            document.getElementById('box-b').style.opacity = turn === 'b' ? '1' : '0.5';
            document.getElementById('box-w').style.transform = turn === 'w' ? 'scale(1.05)' : 'scale(1)';
            document.getElementById('box-b').style.transform = turn === 'b' ? 'scale(1.05)' : 'scale(1)';

            let msg = turn === 'w' ? "Turno: Blancas" : "Turno: Negras";
            if (game.in_checkmate()) msg = "¡JAQUE MATE!";
            else if (game.in_draw()) msg = "¡TABLAS!";
            else if (game.in_check()) msg = "⚠️ ¡JAQUE!";

            statusEl.innerText = msg;
            if (game.game_over()) clearInterval(timerInterval);
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const t = game.turn();
                timers[t]--;
                const m = Math.floor(timers[t] / 60);
                const s = timers[t] % 60;
                document.getElementById(`clock-${t}`).innerText = `${m}:${s < 10 ? '0' : ''}${s}`;
                if (timers[t] <= 0) {
                    clearInterval(timerInterval);
                    alert("¡Tiempo agotado!");
                }
            }, 1000);
        }

        function undoMove() { game.undo(); selectedSquare = null; renderBoard(); }
        function resetGame() { location.reload(); }

        renderBoard();
    </script>
